<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0D0B11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARENA">
<meta name="description" content="Igre gladi uživo, na tvojoj mapi.">
<link rel="manifest" href="/arena/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ARENA — Igre gladi IRL</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">

  <!-- ═══ učitavanje ═══ -->
  <section class="screen on" id="s-boot">
    <div class="scroll" style="display:grid;place-items:center">
      <div class="center stack">
        <div class="spinner" style="margin:0 auto"></div>
        <p class="dim" data-i="loading">Učitavanje…</p>
      </div>
    </div>
  </section>

  <!-- ═══ početni ═══ -->
  <section class="screen" id="s-home">
    <div class="embers" id="embers" aria-hidden="true"></div>
    <div class="scroll">
      <div class="hold stack-lg">
        <div class="brand">
          <div class="mark" id="brandMark"></div>
          <div class="logo">ARENA</div>
          <div class="tag" data-i="tagline"></div>
        </div>

        <div class="card stack">
          <div class="row">
            <div id="homeAvatar"></div>
            <div class="grow field">
              <label class="label" data-i="yourName"></label>
              <input class="input" id="nameInput" maxlength="16" autocomplete="off" data-i-ph="yourName">
            </div>
          </div>
          <button class="btn ghost" id="btnAvatar"><span data-i="avatarTitle"></span></button>
        </div>

        <button class="btn primary lg full" id="btnCreate" data-i="createRoom"></button>
        <div class="or-line"><span data-i="or"></span></div>
        <div class="stack">
          <input class="input code" id="codeInput" maxlength="5" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" data-i-ph="enterCode">
          <button class="btn lg full" id="btnJoin" data-i="joinRoom"></button>
        </div>

        <div class="row between">
          <button class="linkbtn" id="btnLang">SR / EN</button>
          <button class="linkbtn" id="btnTheme"></button>
        </div>
        <p class="tiny mute center" id="testBadge" hidden></p>
      </div>
    </div>
  </section>

  <!-- ═══ lobi ═══ -->
  <section class="screen" id="s-lobby">
    <div class="topbar">
      <div class="grow">
        <div class="tiny dim upper" data-i="roomCode"></div>
        <div class="code-display" id="lobbyCode">-----</div>
      </div>
      <button class="iconbtn sm" id="btnQr" data-i-aria="showQr"></button>
      <button class="iconbtn sm" id="btnShare" data-i-aria="share"></button>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="lobbyBody"></div></div>
  </section>

  <!-- ═══ priprema (5 koraka) ═══ -->
  <section class="screen" id="s-prep">
    <div class="topbar">
      <div class="grow"><h2 data-i="prepTitle"></h2></div>
      <div class="chip" id="prepStepChip"></div>
    </div>
    <div class="scroll"><div class="hold"><div class="steps" id="prepSteps"></div><div id="prepBody"></div></div></div>
  </section>

  <!-- ═══ PREP faza: idi na startnu tačku ═══ -->
  <section class="screen" id="s-deploy">
    <div class="scroll"><div class="hold stack-lg" id="deployBody"></div></div>
  </section>

  <!-- ═══ igra ═══ -->
  <section class="screen" id="s-game">
    <div id="gamemap"></div>
    <div class="fog" id="fog" aria-hidden="true"></div>
    <div class="danger-vignette" id="dangerVig" aria-hidden="true"></div>
    <div class="zone-flash" id="zoneFlash" aria-hidden="true"></div>

    <div class="hud-top">
      <div class="zonechip" id="zoneChip"></div>
      <div class="sp"></div>
      <button class="iconbtn sm" id="btnMenu" data-i-aria="menu"></button>
    </div>

    <div class="hud-bottom">
      <div class="compass" id="compass" hidden>
        <div class="strip" id="compassStrip"></div>
        <div class="needle"></div>
      </div>
      <div class="vitals" id="vitals"></div>
      <button class="action-btn" id="actionBtn" hidden></button>
      <div class="dock">
        <button class="dockbtn" id="btnInv"><span class="ico"></span><span data-i="inventory"></span></button>
        <button class="camera-btn" id="btnCamera" data-i-aria="camera"></button>
        <button class="dockbtn" id="btnFeed"><span class="ico"></span><span data-i="feed"></span></button>
      </div>
    </div>
  </section>

  <!-- ═══ borba ═══ -->
  <section class="screen" id="s-fight">
    <div class="fight-top">
      <div class="chip danger" id="fightTag"></div>
      <div class="sp"></div>
      <div class="round-ring" id="roundRing"></div>
    </div>
    <div class="fighters" id="fighters"></div>
    <div class="distance-track"><div class="dtrack" id="dtrack"></div><div class="range-hint" id="rangeHint"></div></div>
    <div class="combat-log" id="combatLog"></div>
    <div class="sp"></div>
    <div class="moves" id="moves"></div>
    <div class="fight-extra" id="fightExtra"></div>
  </section>

  <!-- ═══ bekstvo ═══ -->
  <section class="screen" id="s-chase">
    <div class="scroll"><div class="hold center stack-lg" id="chaseBody"></div></div>
  </section>

  <!-- ═══ nebo ═══ -->
  <section class="screen" id="s-sky">
    <div class="sky-stars" id="skyStars"></div>
    <div class="scroll" style="display:grid;place-items:center">
      <div class="center stack-lg">
        <h2 class="display" data-i="skyTitle"></h2>
        <p class="dim" data-i="skyBody"></p>
        <div class="sky-faces" id="skyFaces"></div>
      </div>
    </div>
  </section>

  <!-- ═══ duh / tvorac igara ═══ -->
  <section class="screen" id="s-ghost">
    <div class="topbar"><div class="grow"><h2 data-i="ghostTitle"></h2></div>
      <div class="spark-pool" id="sparkPool"></div></div>
    <div class="scroll"><div class="hold stack-lg" id="ghostBody"></div></div>
  </section>

  <!-- ═══ mentor / gledalac ═══ -->
  <section class="screen" id="s-mentor">
    <div class="topbar"><div class="grow"><h2 id="mentorTitle"></h2></div>
      <div class="chip gold" id="favorChip"></div></div>
    <div class="scroll"><div class="hold stack-lg" id="mentorBody"></div></div>
  </section>

  <!-- ═══ kraj ═══ -->
  <section class="screen" id="s-end">
    <div class="scroll"><div class="hold stack-lg" id="endBody"></div></div>
  </section>

  <div class="toasts" id="toasts"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/haptics.js"></script>
<script src="js/net/clock.js"></script>
<script src="js/net/store.js"></script>
<script src="js/ui/kit.js"></script>
<script src="js/ui/sensors.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/game/engine.js"></script>
<script src="js/game/items.js"></script>
<script src="js/game/combat.js"></script>
<script src="js/game/encounter.js"></script>
<script src="js/game/bots.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
