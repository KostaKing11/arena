<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0C0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARENA">
<meta name="description" content="Igre gladi uživo, na tvojoj mapi.">
<link rel="manifest" href="/arena/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ARENA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css?v=0.13.7">
<link rel="stylesheet" href="css/base.css?v=0.13.7">
<link rel="stylesheet" href="css/components.css?v=0.13.7">
<link rel="stylesheet" href="css/screens.css?v=0.13.7">
<link rel="stylesheet" href="css/game.css?v=0.13.7">
</head>
<body>
<div id="app">

  <!-- ═══ učitavanje ═══ -->
  <section class="screen on" id="s-boot">
    <div class="scroll" style="display:grid;place-items:center">
      <div class="center stack"><div class="spinner" style="margin:0 auto"></div></div>
    </div>
  </section>

  <!-- ═══ početni ═══ -->
  <section class="screen" id="s-home">
    <div class="scroll">
      <div class="hold stack">
        <div class="brand">
          <div class="mark" id="brandMark"></div>
          <div class="logo">ARENA</div>
          <button class="iconbtn plain" id="btnSettingsHome" data-i-aria="settings"></button>
        </div>

        <div class="idcard">
          <button id="btnAvatar" class="avbtn"><span id="homeAvatar"></span></button>
          <div class="grow">
            <div class="upper mute" data-i="yourName"></div>
            <input class="namein" id="nameInput" maxlength="16" autocomplete="off" data-i-ph="yourName">
          </div>
          <span class="mute" id="idcardEdit"></span>
        </div>

        <button class="btn primary lg full" id="btnCreate" data-i="createRoom"></button>

        <div class="row">
          <input class="input code grow" id="codeInput" maxlength="5" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" data-i-ph="codePh">
          <button class="btn lg" id="btnJoin" data-i="joinRoom"></button>
        </div>

        <button class="btn ghost full" id="btnQuickTest" hidden>
          <span id="qtIcon"></span><span data-i="testWithBots"></span></button>
      </div>
    </div>
  </section>

  <!-- ═══ podešavanja ═══ -->
  <section class="screen" id="s-settings">
    <div class="topbar">
      <button class="iconbtn plain" id="btnSetBack" data-i-aria="back"></button>
      <div class="grow ttl" data-i="settings"></div>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="settingsBody"></div></div>
  </section>

  <!-- ═══ lobi ═══ -->
  <section class="screen" id="s-lobby">
    <div class="topbar">
      <button class="iconbtn plain" id="btnLobbyBack" data-i-aria="back"></button>
      <div class="grow">
        <div class="upper mute" data-i="roomCode"></div>
        <div class="code-display" id="lobbyCode">-----</div>
      </div>
      <button class="iconbtn plain" id="btnQr" data-i-aria="showQr"></button>
      <button class="iconbtn plain" id="btnShare" data-i-aria="share"></button>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="lobbyBody"></div></div>
  </section>

  <!-- ═══ priprema ═══ -->
  <section class="screen" id="s-prep">
    <div class="topbar">
      <button class="iconbtn plain" id="btnPrepBack" data-i-aria="back"></button>
      <div class="grow ttl" data-i="prepTitle"></div>
      <div class="chip" id="prepStepChip"></div>
    </div>
    <div class="scroll"><div class="hold"><div class="steps" id="prepSteps"></div><div id="prepBody"></div></div></div>
  </section>

  <!-- ═══ PREP faza ═══ -->
  <section class="screen" id="s-deploy">
    <div class="scroll"><div class="hold stack" id="deployBody"></div></div>
  </section>

  <!-- ═══ igra ═══ -->
  <section class="screen" id="s-game">
    <div id="gamemap"></div>
    <div class="fog" id="fog" aria-hidden="true"></div>
    <div class="danger-vignette" id="dangerVig" aria-hidden="true"></div>
    <!-- duh u zoni: mesto mu je napolju, unutra samo zbunjuje žive -->
    <div class="ghost-banner" id="ghostBanner" hidden></div>
    <div class="zone-flash" id="zoneFlash" aria-hidden="true"></div>

    <div class="hud-top">
      <div class="zonechip glass" id="zoneChip"></div>
      <!-- svoju klasu vidiš dvaput u životu: na deljenju i kad je zaboraviš -->
      <button class="classchip glass" id="classChip" hidden></button>
      <div class="sp"></div>
      <button class="iconbtn glass" id="btnRecenter" data-i-aria="center"></button>
      <button class="iconbtn glass" id="btnMenu" data-i-aria="menu"></button>
    </div>

    <div class="hud-bottom">
      <!-- Kompas stoji DOLE, uz palac. Gore se sudarao sa trakom zone, a i
           gleda se u isto vreme kad i vitalni — ne kad i sat do skupljanja. -->
      <div class="compass glass" id="compass">
        <div class="strip" id="compassStrip"><div class="ticks" id="compassTicks"></div></div>
        <div class="marks" id="compassMarks"></div>
        <div class="center"></div>
      </div>
      <!-- efekti sa trajanjem: bez ovoga igrač ne može da planira oko nečega
           što ne vidi (baklje, ogrtač, dim, adrenalin, durbin, otrov…) -->
      <div class="fx-bar" id="fxBar" aria-live="polite"></div>
      <div class="vitals" id="vitals"></div>
      <button class="action-btn" id="actionBtn" hidden></button>
      <div class="dock">
        <button class="dockbtn" id="btnInv"></button>
        <button class="dockbtn" id="btnFeed"></button>
        <button class="camera-btn" id="btnCamera" data-i-aria="camera"></button>
        <button class="dockbtn" id="btnPlayers"></button>
        <button class="dockbtn" id="btnGhost"></button>
      </div>
    </div>
  </section>

  <!-- ═══ nišanjenje — jedini način napada (borba v4) ═══ -->
  <section class="screen" id="s-aim">
    <video id="aimVid" playsinline muted></video>
    <canvas id="aimCan" hidden></canvas>
    <div class="aim-vig" aria-hidden="true"></div>

    <div class="aim-top">
      <button class="iconbtn glass" id="aimBack" data-i-aria="back"></button>
      <div class="chip glass" id="aimWeapon"></div>
      <div class="sp"></div>
      <div class="row-tight wrap" id="aimStatus"></div>
    </div>

    <!-- nišan u sredini ekrana -->
    <div class="aim-reticle" id="aimReticle" aria-hidden="true">
      <i class="c"></i><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i>
    </div>

    <!-- ko je na nišanu, i na kojoj razdaljini -->
    <div class="aim-lock" id="aimLock"></div>

    <div class="aim-bottom">
      <div class="aim-range" id="aimRange"></div>
      <div class="aim-list" id="aimList"></div>
      <div class="aim-hint" id="aimHint"></div>
      <!-- Dugmad su STATIČNA: petlja uživo im menja samo natpis i stanje.
           Da se prave iznova, držanje bi pucalo usred nišanjenja. -->
      <div class="aim-actions">
        <span class="aim-side off" aria-hidden="true"></span>
        <button class="aim-fire" id="aimFire">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="bg" cx="50" cy="50" r="45"></circle>
            <circle class="fg" cx="50" cy="50" r="45"></circle>
          </svg>
          <span class="lbl"></span>
          <span class="cd" hidden></span>
        </button>
        <button class="aim-side off" id="aimSpecial"></button>
      </div>
    </div>
  </section>

  <!-- ═══ duh: dogovor, događaji, igrači ═══ -->
  <section class="screen" id="s-ghost">
    <div class="topbar">
      <button class="iconbtn plain" id="btnGhostBack" data-i-aria="back"></button>
      <div class="grow ttl" data-i="ghostTitle"></div>
      <div class="spark-pool" id="sparkPool"></div>
    </div>
    <div class="tabs" id="ghostTabs"></div>
    <div class="scroll"><div class="hold stack-lg" id="ghostBody"></div></div>
    <!-- pisanje stoji van skrola: tastatura ne sme da ga odgura -->
    <div class="chat-bar" id="ghostChatBar" hidden>
      <input class="input grow" id="ghostChatInput" maxlength="200" autocomplete="off">
      <button class="iconbtn gold" id="ghostChatSend" data-i-aria="send"></button>
    </div>
  </section>

  <!-- ═══ gledanje jednog igrača (duh) ═══ -->
  <section class="screen" id="s-watch">
    <div class="topbar">
      <button class="iconbtn plain" id="btnWatchBack" data-i-aria="back"></button>
      <div class="grow ttl" id="watchTitle"></div>
      <div class="chip" id="watchAim" hidden></div>
    </div>
    <div class="watch-map" id="watchMap"></div>
    <div class="scroll"><div class="hold stack" id="watchBody"></div></div>
    <!-- kadar iz borbe preko celog ekrana, 2 s -->
    <div class="watch-shot" id="watchShot" hidden></div>
  </section>

  <!-- ═══ mentor ═══ -->
  <section class="screen" id="s-mentor">
    <div class="topbar"><div class="grow ttl" id="mentorTitle"></div>
      <div class="chip gold" id="favorChip"></div></div>
    <!-- mapa je glavni deo: mentor gleda partiju, ne igra svoju.
         Dugme stoji VAN mape — unutra bi ga Leaflet primio kao prevlačenje. -->
    <div class="mentor-map-wrap">
      <div class="mentor-map" id="mentorMap"></div>
      <button class="iconbtn glass" id="mentorFollow" data-i-aria="center"></button>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="mentorBody"></div></div>
  </section>

  <!-- ═══ kraj ═══ -->
  <section class="screen" id="s-end">
    <div class="scroll"><div class="hold stack-lg" id="endBody"></div></div>
  </section>

  <div class="toasts" id="toasts"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script src="js/firebase-config.js?v=0.13.7"></script>
<script src="js/core/util.js?v=0.13.7"></script>
<script src="js/core/rules.js?v=0.13.7"></script>
<script src="js/core/i18n.js?v=0.13.7"></script>
<script src="js/core/icons.js?v=0.13.7"></script>
<script src="js/core/haptics.js?v=0.13.7"></script>
<script src="js/net/clock.js?v=0.13.7"></script>
<script src="js/net/store.js?v=0.13.7"></script>
<script src="js/ui/kit.js?v=0.13.7"></script>
<script src="js/ui/avatar.js?v=0.13.7"></script>
<script src="js/ui/nav.js?v=0.13.7"></script>
<script src="js/ui/sensors.js?v=0.13.7"></script>
<script src="js/ui/map.js?v=0.13.7"></script>
<script src="js/game/engine.js?v=0.13.7"></script>
<script src="js/game/items.js?v=0.13.7"></script>
<script src="js/game/combat.js?v=0.13.7"></script>
<script src="js/game/encounter.js?v=0.13.7"></script>
<script src="js/game/mentor.js?v=0.13.7"></script>
<script src="js/game/bots.js?v=0.13.7"></script>
<script src="js/ui/screens.js?v=0.13.7"></script>
<script src="js/app.js?v=0.13.7"></script>
</body>
</html>
