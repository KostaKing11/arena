<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0C0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARENA">
<meta name="description" content="Igre gladi uživo, na tvojoj mapi.">
<link rel="manifest" href="/arena/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ARENA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">

  <!-- ═══ učitavanje ═══ -->
  <section class="screen on" id="s-boot">
    <div class="scroll" style="display:grid;place-items:center">
      <div class="center stack"><div class="spinner" style="margin:0 auto"></div></div>
    </div>
  </section>

  <!-- ═══ početni ═══ -->
  <section class="screen" id="s-home">
    <div class="scroll">
      <div class="hold stack">
        <div class="brand">
          <div class="mark" id="brandMark"></div>
          <div class="logo">ARENA</div>
          <button class="iconbtn plain" id="btnSettingsHome" data-i-aria="settings"></button>
        </div>

        <div class="idcard">
          <button id="btnAvatar" class="avbtn"><span id="homeAvatar"></span></button>
          <div class="grow">
            <div class="upper mute" data-i="yourName"></div>
            <input class="namein" id="nameInput" maxlength="16" autocomplete="off" data-i-ph="yourName">
          </div>
          <span class="mute" id="idcardEdit"></span>
        </div>

        <button class="btn primary lg full" id="btnCreate" data-i="createRoom"></button>

        <div class="row">
          <input class="input code grow" id="codeInput" maxlength="5" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" data-i-ph="codePh">
          <button class="btn lg" id="btnJoin" data-i="joinRoom"></button>
        </div>

        <button class="btn ghost full" id="btnQuickTest" hidden>
          <span id="qtIcon"></span><span data-i="testWithBots"></span></button>
      </div>
    </div>
  </section>

  <!-- ═══ podešavanja ═══ -->
  <section class="screen" id="s-settings">
    <div class="topbar">
      <button class="iconbtn plain" id="btnSetBack" data-i-aria="back"></button>
      <div class="grow ttl" data-i="settings"></div>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="settingsBody"></div></div>
  </section>

  <!-- ═══ lobi ═══ -->
  <section class="screen" id="s-lobby">
    <div class="topbar">
      <button class="iconbtn plain" id="btnLobbyBack" data-i-aria="back"></button>
      <div class="grow">
        <div class="upper mute" data-i="roomCode"></div>
        <div class="code-display" id="lobbyCode">-----</div>
      </div>
      <button class="iconbtn plain" id="btnQr" data-i-aria="showQr"></button>
      <button class="iconbtn plain" id="btnShare" data-i-aria="share"></button>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="lobbyBody"></div></div>
  </section>

  <!-- ═══ priprema ═══ -->
  <section class="screen" id="s-prep">
    <div class="topbar">
      <button class="iconbtn plain" id="btnPrepBack" data-i-aria="back"></button>
      <div class="grow ttl" data-i="prepTitle"></div>
      <div class="chip" id="prepStepChip"></div>
    </div>
    <div class="scroll"><div class="hold"><div class="steps" id="prepSteps"></div><div id="prepBody"></div></div></div>
  </section>

  <!-- ═══ PREP faza ═══ -->
  <section class="screen" id="s-deploy">
    <div class="scroll"><div class="hold stack" id="deployBody"></div></div>
  </section>

  <!-- ═══ igra ═══ -->
  <section class="screen" id="s-game">
    <div id="gamemap"></div>
    <div class="fog" id="fog" aria-hidden="true"></div>
    <div class="danger-vignette" id="dangerVig" aria-hidden="true"></div>
    <div class="zone-flash" id="zoneFlash" aria-hidden="true"></div>

    <div class="hud-top">
      <div class="zonechip glass" id="zoneChip"></div>
      <div class="sp"></div>
      <button class="iconbtn glass" id="btnRecenter" data-i-aria="center"></button>
      <button class="iconbtn glass" id="btnMenu" data-i-aria="menu"></button>
    </div>

    <div class="compass glass" id="compass">
      <div class="strip" id="compassStrip"></div>
      <div class="center"></div>
    </div>

    <div class="hud-bottom">
      <div class="vitals" id="vitals"></div>
      <button class="action-btn" id="actionBtn" hidden></button>
      <div class="dock">
        <button class="dockbtn" id="btnInv"></button>
        <button class="dockbtn" id="btnFeed"></button>
        <button class="camera-btn" id="btnCamera" data-i-aria="camera"></button>
        <button class="dockbtn" id="btnPlayers"></button>
        <button class="dockbtn" id="btnGhost"></button>
      </div>
    </div>
  </section>

  <!-- ═══ borba ═══ -->
  <section class="screen" id="s-fight">
    <div class="arena-stage" id="arenaStage">
      <div class="ground"></div><div class="horizon"></div>
      <div class="cover l" id="coverL"></div><div class="cover r" id="coverR"></div>
      <div class="fighter-tag me" id="tagMe"></div>
      <div class="fighter-tag foe" id="tagFoe"></div>
      <div class="fighter-fig me" id="figMe"></div>
      <div class="fighter-fig foe" id="figFoe"></div>
      <div class="dmg-pop me" id="popMe"></div>
      <div class="dmg-pop foe" id="popFoe"></div>
    </div>
    <div class="round-bar" id="roundBar">
      <span class="rn" id="roundNum"></span>
      <span class="timer"><i id="roundTimer"></i></span>
    </div>
    <div class="dtrack" id="dtrack"></div>
    <div class="range-hint" id="rangeHint"></div>
    <div class="combat-log" id="combatLog"></div>
    <div class="sp"></div>
    <div class="moves" id="moves"></div>
    <div class="fight-extra" id="fightExtra"></div>
  </section>

  <!-- ═══ bekstvo ═══ -->
  <section class="screen" id="s-chase">
    <div class="scroll"><div class="hold center stack-lg" id="chaseBody"></div></div>
  </section>

  <!-- ═══ nebo ═══ -->
  <section class="screen" id="s-sky">
    <div class="sky-stars" id="skyStars"></div>
    <div class="scroll" style="display:grid;place-items:center">
      <div class="center stack-lg">
        <h2 class="display" data-i="skyTitle"></h2>
        <p class="dim" data-i="skyBody"></p>
        <div class="sky-faces" id="skyFaces"></div>
      </div>
    </div>
  </section>

  <!-- ═══ duh ═══ -->
  <section class="screen" id="s-ghost">
    <div class="topbar">
      <button class="iconbtn plain" id="btnGhostBack" data-i-aria="back"></button>
      <div class="grow ttl" data-i="ghostTitle"></div>
      <div class="spark-pool" id="sparkPool"></div>
    </div>
    <div class="scroll"><div class="hold stack-lg" id="ghostBody"></div></div>
  </section>

  <!-- ═══ mentor ═══ -->
  <section class="screen" id="s-mentor">
    <div class="topbar"><div class="grow ttl" id="mentorTitle"></div>
      <div class="chip gold" id="favorChip"></div></div>
    <div class="scroll"><div class="hold stack-lg" id="mentorBody"></div></div>
  </section>

  <!-- ═══ kraj ═══ -->
  <section class="screen" id="s-end">
    <div class="scroll"><div class="hold stack-lg" id="endBody"></div></div>
  </section>

  <div class="toasts" id="toasts"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/haptics.js"></script>
<script src="js/net/clock.js"></script>
<script src="js/net/store.js"></script>
<script src="js/ui/kit.js"></script>
<script src="js/ui/avatar.js"></script>
<script src="js/ui/nav.js"></script>
<script src="js/ui/sensors.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/game/engine.js"></script>
<script src="js/game/items.js"></script>
<script src="js/game/combat.js"></script>
<script src="js/game/encounter.js"></script>
<script src="js/game/mentor.js"></script>
<script src="js/game/bots.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
